<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">মাই ই-কমার্স</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding-bottom: 50px; }

    /* Header */
    header { background: white; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; position: sticky; top: 0; z-index: 900; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    
    .left-header { display: flex; align-items: center; gap: 15px; }
    .menu-btn { font-size: 20px; color: #1e293b; background: none; border: none; cursor: pointer; padding: 5px; transition: 0.2s; }
    .menu-btn:hover { color: #2563eb; }

    .logo-box { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #2563eb; }
    .shop-name { font-size: 18px; font-weight: 700; color: #1e293b; }

    .search-box { display: flex; align-items: center; background: #f1f5f9; padding: 6px 12px; border-radius: 20px; border: 1px solid #cbd5e1; flex: 1; max-width: 250px; }
    .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 13px; margin-left: 6px; }

    /* Slide-out Category Sidebar Overlay */
    .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
    .sidebar-menu-box { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 1001; transition: 0.3s ease-in-out; box-shadow: 4px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .sidebar-menu-box.active { left: 0; }
    .sidebar-header { padding: 15px 20px; background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .close-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    
    .category-list-menu { list-style: none; overflow-y: auto; padding: 10px 0; }
    .category-list-menu li a { display: block; padding: 12px 20px; font-size: 14px; color: #334155; text-decoration: none; font-weight: 600; border-bottom: 1px solid #f1f5f9; transition: 0.2s; }
    .category-list-menu li a:hover, .category-list-menu li a.active { background: #eff6ff; color: #2563eb; padding-left: 25px; }

    /* Layout & Products */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .hero-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .hero-img { width: 100%; height: 220px; object-fit: cover; }
    .hero-content { padding: 15px 20px; text-align: center; }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; transition: 0.3s; position: relative; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
    .prod-img-box { position: relative; width: 100%; height: 170px; background: #f8fafc; }
    .prod-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-brand-logo { position: absolute; top: 10px; left: 10px; background: white; padding: 2px 6px; border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #0f172a; }
    .badge-brand-logo img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
    .badge-cat { position: absolute; top: 10px; right: 10px; background: rgba(15,23,42,0.75); color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; }

    .prod-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .prod-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
    .price-box { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    .product-price { color: #2563eb; font-weight: 700; font-size: 15px; }
    .old-price { text-decoration: line-through; color: #94a3b8; font-size: 12px; }
    .prod-rating { color: #f59e0b; font-size: 11px; margin-bottom: 6px; }
    .stock-info { font-size: 11px; color: #64748b; margin-bottom: 10px; }

    .btn { width: 100%; padding: 8px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; font-size: 13px; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-whatsapp { background: #25d366; color: white; margin-top: 20px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
    .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- Header with 3-line Menu Button -->
  <header>
    <div class="header-container">
      <div class="left-header">
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <div class="logo-box" onclick="filterCategory('All')">
          <img id="shopLogoImg" class="logo-img" src="https://picsum.photos/100/100?random=88" alt="Logo">
          <span class="shop-name" id="displayShopName">মাই ই-কমার্স</span>
        </div>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color:#94a3b8; font-size:13px;"></i>
        <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="প্রোডাক্ট খুঁজুন...">
      </div>
    </div>
  </header>

  <!-- 3-Line Menu Drawer Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar-menu-box" id="sidebarMenuBox">
    <div class="sidebar-header">
      <span><i class="fa-solid fa-list"></i> ক্যাটাগরি তালিকা</span>
      <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="category-list-menu" id="drawerCatList"></ul>
  </div>

  <div class="container">
    <div class="hero-card">
      <img id="displayHeroImg" class="hero-img" src="https://picsum.photos/800/300" alt="Banner">
      <div class="hero-content">
        <h1 id="displayTitle" style="font-size:20px;">স্বাগতম আমাদের শপে! 👋</h1>
        <p id="displayDesc" style="color:#64748b; font-size:13px; margin-top:3px;">আমাদের প্রিমিয়াম কোয়ালিটির প্রোডাক্ট কালেকশন দেখুন।</p>
      </div>
    </div>

    <div class="section-title" id="productSection">
      <i class="fa-solid fa-bag-shopping" style="color:#2563eb;"></i> 
      <span id="currentCatTitle">সব প্রোডাক্টসমূহ</span>
    </div>
    <div class="product-grid" id="productGrid"></div>

    <a id="whatsappBtn" href="https://wa.me/8801700000000" target="_blank" class="btn btn-whatsapp">
      <i class="fa-brands fa-whatsapp"></i> হোয়াটসঅ্যাপে সরাসরি কথা বলুন
    </a>
  </div>

  <!-- Buy Modal -->
  <div class="modal" id="buyModal">
    <div class="modal-content">
      <h3 id="modalProductTitle" style="margin-bottom:10px; font-size:16px;">অর্ডার নিশ্চিত করুন</h3>
      <div id="modalPriceDetails" style="font-size:13px; font-weight:bold; color:#2563eb; margin-bottom:12px;"></div>

      <div class="form-group" style="background:#f8fafc; padding:10px; border-radius:8px; border:1px dashed #cbd5e1;">
        <label style="font-size:11px; margin-bottom:3px;">ডিসকাউন্ট কুপন কোড</label>
        <div style="display:flex; gap:5px;">
          <input type="text" id="modalCouponInput" placeholder="কুপন কোড">
          <button type="button" class="btn-primary" style="width:auto; padding:0 10px; font-size:12px;" onclick="applyModalCoupon()">প্রয়োগ</button>
        </div>
        <div id="couponMsg" style="font-size:11px; margin-top:4px; color:#16a34a; font-weight:600;"></div>
      </div>

      <div class="form-group"><label>আপনার নাম *</label><input type="text" id="custName"></div>
      <div class="form-group"><label>মোবাইল নম্বর *</label><input type="text" id="custPhone"></div>
      <div class="form-group"><label>ঠিকানা *</label><textarea id="custAddress"></textarea></div>
      <div class="form-group">
        <label>কুরিয়ার</label>
        <select id="custCourier">
          <option value="Steadfast">Steadfast Courier</option>
          <option value="Pathao">Pathao Courier</option>
          <option value="Paperfly">Paperfly Courier</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="confirmOrder()">অর্ডার সাবমিট করুন</button>
      <button class="btn" style="background:#cbd5e1; margin-top:8px;" onclick="closeModal()">বাতিল করুন</button>
    </div>
  </div>

  <script>
    let selectedProductForBuy = null;
    let modalDiscountAmount = 0;
    let currentCategory = "All";

    let products = JSON.parse(localStorage.getItem('products')) || [];
    let siteConfig = JSON.parse(localStorage.getItem('siteConfig')) || {
      shopName: "মাই ই-কমার্স",
      logoImg: "https://picsum.photos/100/100?random=88",
      title: "স্বাগতম আমাদের শপে! 👋",
      heroImg: "https://picsum.photos/800/300",
      desc: "আমাদের প্রিমিয়াম কোয়ালিটির প্রোডাক্ট কালেকশন দেখুন।",
      phone: "8801700000000",
      couponCode: "DISCOUNT50",
      couponAmount: 50
    };

    function loadConfigToUI() {
      document.getElementById('displayShopName').innerText = siteConfig.shopName;
      document.getElementById('pageTitle').innerText = siteConfig.shopName;
      document.getElementById('shopLogoImg').src = siteConfig.logoImg;
      document.getElementById('displayTitle').innerText = siteConfig.title;
      document.getElementById('displayHeroImg').src = siteConfig.heroImg;
      document.getElementById('displayDesc').innerText = siteConfig.desc;
      document.getElementById('whatsappBtn').href = `https://wa.me/${siteConfig.phone}`;
    }

    function toggleSidebar() {
      const box = document.getElementById('sidebarMenuBox');
      const overlay = document.getElementById('sidebarOverlay');
      if (box.classList.contains('active')) {
        box.classList.remove('active');
        overlay.style.display = 'none';
      } else {
        box.classList.add('active');
        overlay.style.display = 'block';
      }
    }

    function renderDrawerCategories() {
      const drawer = document.getElementById('drawerCatList');
      const allCategories = ['All', ...new Set(products.map(p => p.category || 'General'))];
      
      drawer.innerHTML = '';
      allCategories.forEach(cat => {
        const activeClass = cat === currentCategory ? 'active' : '';
        drawer.innerHTML += `
          <li>
            <a href="#" class="${activeClass}" onclick="filterCategory('${cat}')">
              ${cat === 'All' ? 'সব প্রোডাক্ট (Home)' : cat}
            </a>
          </li>
        `;
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.getElementById('currentCatTitle').innerText = cat === 'All' ? 'সব প্রোডাক্টসমূহ' : `${cat} ক্যাটাগরি`;
      renderDrawerCategories();
      renderProducts();
      
      const box = document.getElementById('sidebarMenuBox');
      if(box.classList.contains('active')) toggleSidebar();
    }

    function searchProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(query);
    }

    function renderProducts(searchQuery = '') {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      let filtered = products;
      if (currentCategory !== 'All') {
        filtered = filtered.filter(p => (p.category || 'General') === currentCategory);
      }

      if (searchQuery) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:#64748b; font-size:14px; grid-column: 1/-1;">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
        return;
      }

      filtered.forEach(p => {
        let priceHtml = `<div class="product-price">৳ ${p.discPrice || p.price}</div>`;
        if(p.discPrice) {
          priceHtml = `
            <div class="price-box">
              <span class="product-price">৳ ${p.discPrice}</span>
              <span class="old-price">৳ ${p.price}</span>
            </div>
          `;
        }

        let logoHtml = p.logoImg ? `<div class="badge-brand-logo"><img src="${p.logoImg}"> Verified</div>` : '';

        grid.innerHTML += `
          <div class="product-card">
            <div class="prod-img-box">
              <img src="${p.img}" class="prod-img">
              ${logoHtml}
              <span class="badge-cat">${p.category || 'General'}</span>
            </div>
            <div class="prod-details">
              <div>
                <div class="prod-title">${p.name}</div>
                <div class="prod-rating"><i class="fa-solid fa-star"></i> ${p.rating}</div>
                ${priceHtml}
              </div>
              <div>
                <div class="stock-info">স্টক: ${p.stock} পিস | বিক্রি: ${p.sold} পিস</div>
                <button class="btn btn-primary" onclick="openBuyModal(${p.id})">অর্ডার করুন</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openBuyModal(productId) {
      selectedProductForBuy = products.find(p => p.id === productId);
      modalDiscountAmount = 0;
      document.getElementById('modalCouponInput').value = '';
      document.getElementById('couponMsg').innerText = '';

      if(selectedProductForBuy) {
        let basePrice = selectedProductForBuy.discPrice ? selectedProductForBuy.discPrice : selectedProductForBuy.price;
        document.getElementById('modalProductTitle').innerText = `${selectedProductForBuy.name} - অর্ডার করুন`;
        document.getElementById('modalPriceDetails').innerText = `মূল্য: ৳ ${basePrice}`;
      }
      document.getElementById('buyModal').style.display = 'flex';
    }

    function applyModalCoupon() {
      const code = document.getElementById('modalCouponInput').value.trim();
      if(code === siteConfig.couponCode) {
        modalDiscountAmount = Number(siteConfig.couponAmount);
        let basePrice = selectedProductForBuy.discPrice ? selectedProductForBuy.discPrice : selectedProductForBuy.price;
        let finalPrice = basePrice - modalDiscountAmount;
        if(finalPrice < 0) finalPrice = 0;

        document.getElementById('modalPriceDetails').innerText = `মূল্য: ৳ ${basePrice} - ছাড় (${modalDiscountAmount} টাকা) = মোট ৳ ${finalPrice}`;
        document.getElementById('couponMsg').innerText = `সফল! ${modalDiscountAmount} টাকা ডিসকাউন্ট প্রয়োগ হয়েছে।`;
      } else {
        document.getElementById('couponMsg').style.color = '#ef4444';
        document.getElementById('couponMsg').innerText = `ভুল কুপন কোড!`;
      }
    }

    function closeModal() { document.getElementById('buyModal').style.display = 'none'; }

    function confirmOrder() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const courier = document.getElementById('custCourier').value;

      if(!name || !phone || !address) { alert('সব তথ্য পূরণ করুন।'); return; }

      let basePrice = selectedProductForBuy.discPrice ? selectedProductForBuy.discPrice : selectedProductForBuy.price;
      let finalPrice = basePrice - modalDiscountAmount;

      const newOrder = {
        id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
        date: new Date().toLocaleString('bn-BD'),
        productName: selectedProductForBuy.name,
        price: finalPrice < 0 ? 0 : finalPrice,
        custName: name,
        custPhone: phone,
        custAddress: address,
        courier: courier,
        status: "Pending"
      };

      let existingOrders = JSON.parse(localStorage.getItem('orders')) || [];
      existingOrders.unshift(newOrder);
      localStorage.setItem('orders', JSON.stringify(existingOrders));

      alert('অর্ডার সফল হয়েছে! অর্ডার আইডি: ' + newOrder.id);
      closeModal();
    }

    loadConfigToUI();
    renderDrawerCategories();
    renderProducts();
  </script>
</body>
</html>
<script>

</script>
</body>
</html>
