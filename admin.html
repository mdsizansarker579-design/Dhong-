<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHONG Admin Panel - Full Fixed</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#182230;--muted:#667085;--dark:#151b2b;--accent:#6558e8;--line:#e7eaf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--dark);color:white;padding:20px 14px}
.brand{font-size:22px;font-weight:900;color:white}
.nav{margin-top:15px;display:flex;flex-direction:column;gap:4px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#cbd2e1;padding:11px 12px;border-radius:8px;cursor:pointer}
.nav button.active,.nav button:hover{background:#343b54;color:white;font-weight:bold}
.main{flex:1;padding:20px}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.stat{font-size:24px;font-weight:800;margin:10px 0 4px}
input,select,textarea{border:1px solid #dce1eb;background:white;border-radius:8px;padding:10px;width:100%;margin-top:4px}
.btn{border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:bold}
.primary{background:var(--accent);color:white}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>

<div id="adminLoginModal" style="position:fixed;inset:0;background:#151b2b;display:flex;align-items:center;justify-content:center;z-index:99999;">
  <div style="background:white;padding:30px;border-radius:14px;width:100%;max-width:380px;text-align:center">
    <h2>DHONG Admin</h2>
    <input type="password" id="adminPassInput" placeholder="পাসওয়ার্ড..." style="margin-bottom:12px">
    <button onclick="checkAdminLogin()" class="primary" style="width:100%;padding:12px">লগইন</button>
  </div>
</div>

<div class="layout">
<aside class="sidebar">
  <div class="brand">DHONG<small>ADMIN</small></div>
  <nav class="nav">
    <button class="active" data-page="dashboard">▦ Dashboard</button>
    <button data-page="orders">▤ Orders</button>
    <button data-page="products">◈ Products & Edit</button>
    <button data-page="moderators">🛡️ Moderators</button>
    <button data-page="profit">৳ Profit</button>
  </nav>
</aside>

<main class="main">
<header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <h1 id="pageTitle" style="margin:0">Dashboard</h1>
  <div id="notificationAlert" style="background:#fff5f5;color:#c53030;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;display:none">🔔 নতুন অর্ডার এসেছে!</div>
</header>

<section class="page active" id="dashboard">
  <div class="grid">
    <div class="card"><div>মোট অর্ডার</div><div class="stat" id="totalOrdersCount">০</div></div>
    <div class="card"><div>নতুন অর্ডার</div><div class="stat" id="newOrdersCount">০</div></div>
    <div class="card"><div>মোট বিক্রি</div><div class="stat" id="totalSalesAmount">৳ ০</div></div>
  </div>
</section>

<section class="page" id="orders">
  <div class="card">
    <h3>অর্ডার লিস্ট</h3>
    <table><thead><tr><th>ID</th><th>কাস্টমার</th><th>ফোন</th><th>টাকা</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody id="orderRows"></tbody></table>
  </div>
</section>

<section class="page" id="products">
  <div class="card">
    <h3 id="formTitle">নতুন পণ্য যোগ বা এডিট</h3>
    <form id="productForm" onsubmit="saveProduct(event)">
      <input type="hidden" id="editKey">
      <input id="pName" required placeholder="পণ্যের নাম">
      <input id="pCat" required placeholder="ক্যাটাগরি">
      <input type="number" id="pPrice" required placeholder="মূল্য">
      <input type="number" id="pStock" required placeholder="স্টক">
      <input id="pImg" placeholder="প্রধান ছবির লিংক (URL)">
      <input id="pColors" placeholder="বাকি ছবিগুলো কমা দিয়ে দিন (Link1, Link2, Link3...)">
      <textarea id="pDesc" placeholder="বিবরণ" rows="2"></textarea>
      <button class="primary" type="submit" style="width:100%;margin-top:8px">পণ্য সংরক্ষণ করুন</button>
    </form>
  </div>
  <div class="card"><h3>প্রোডাক্ট লিস্ট (এডিট / ডিলিট)</h3><div id="productList"></div></div>
</section>

<section class="page" id="moderators">
  <div class="card">
    <h3>মডারেটর যুক্ত করুন</h3>
    <input id="modUser" placeholder="ইউজারনেম">
    <input type="password" id="modPass" placeholder="পাসওয়ার্ড">
    <button class="primary" style="margin-top:8px" onclick="addModerator()">মডারেটর যোগ করুন</button>
    <div id="modList" style="margin-top:15px"></div>
  </div>
</section>

<section class="page" id="profit">
  <div class="card"><h3>প্রফিট রিপোর্ট</h3><div class="stat" id="netProfitAmount">৳ ০</div></div>
</section>
</main>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNQLZU6KiVHp6IcAh4G70Trf7ThTcuLqw",
    authDomain: "dhong-c897d.firebaseapp.com",
    projectId: "dhong-c897d",
    storageBucket: "dhong-c897d.firebasestorage.app",
    messagingSenderId: "14236976798",
    appId: "1:14236976798:web:d8ae40a5add4a70b2a1d8f",
    measurementId: "G-J2RC81D0WB"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let products = [], orders = [], lastOrderCount = 0;

  function checkAdminLogin() {
    let val = document.getElementById("adminPassInput").value;
    db.ref('dhong_admin_pass').once('value').then(snap => {
      if(val === (snap.val() || "admin123")) {
        document.getElementById("adminLoginModal").style.display = "none";
        sessionStorage.setItem("dhong_admin_logged", "true");
      } else { alert("ভুল পাসওয়ার্ড!"); }
    });
  }
  if(sessionStorage.getItem("dhong_admin_logged") === "true") document.getElementById("adminLoginModal").style.display = "none";

  document.querySelectorAll(".nav button").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      b.classList.add("active");
      document.getElementById(b.dataset.page).classList.add("active");
      document.getElementById("pageTitle").textContent = b.textContent;
    });
  });

  db.ref('dhong_products').on('value', snap => {
    products = []; snap.forEach(ch => { let v = ch.val(); if(v) { v._key = ch.key; products.push(v); } });
    loadAdminData();
  });

  db.ref('dhong_orders').on('value', snap => {
    orders = []; snap.forEach(ch => { let v = ch.val(); if(v) { v._key = ch.key; orders.push(v); } });
    if(lastOrderCount > 0 && orders.length > lastOrderCount) {
      // নতুন অর্ডার আসলে নোটিফিকেশন অ্যালার্ট বাজবে বা দেখাবে
      let alertBox = document.getElementById("notificationAlert");
      alertBox.style.display = "block";
      setTimeout(() => alertBox.style.display = "none", 6000);
    }
    lastOrderCount = orders.length;
    loadAdminData();
  });

  function loadAdminData() {
    document.getElementById("totalOrdersCount").textContent = orders.length;
    let newOrd = orders.filter(o => o.status === 'Pending').length;
    document.getElementById("newOrdersCount").textContent = newOrd;
    let totalSales = orders.filter(o => o.status !== 'Cancelled').reduce((s, o) => s + Number(o.total || 0), 0);
    document.getElementById("totalSalesAmount").textContent = "৳ " + totalSales.toLocaleString();
    document.getElementById("netProfitAmount").textContent = "৳ " + Math.round(totalSales * 0.35).toLocaleString();

    document.getElementById("orderRows").innerHTML = orders.length === 0 ? "<tr><td colspan='6'>কোনো অর্ডার নেই।</td></tr>" : orders.map(o => `
      <tr>
        <td>#DH-${o.id}</td><td><b>${o.customer_name}</b></td><td>${o.phone}</td><td>৳${o.total}</td>
        <td><select onchange="updateStatus('${o._key}', this.value)"><option ${o.status=='Pending'?'selected':''}>Pending</option><option ${o.status=='Delivered'?'selected':''}>Delivered</option></select></td>
        <td><button class="btn" style="background:#e53e3e;color:white;padding:4px 8px" onclick="deleteOrder('${o._key}')">ডিলিট</button></td>
      </tr>`).join("");

    document.getElementById("productList").innerHTML = products.map(p => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #eee">
        <span><b>${p.name}</b> - ৳${p.price} (স্টক: ${p.stock})</span>
        <div>
          <button class="btn primary" style="padding:4px 8px" onclick="editProduct('${p._key}')">এডিট</button>
          <button class="btn" style="background:#e53e3e;color:white;padding:4px 8px" onclick="deleteProduct('${p._key}')">ডিলিট</button>
        </div>
      </div>`).join("");

    loadModerators();
  }

  function updateStatus(key, status) { db.ref('dhong_orders/' + key + '/status').set(status); }
  function deleteOrder(key) { if(confirm("অর্ডার ডিলিট করবেন?")) db.ref('dhong_orders/' + key).remove(); }

  // প্রোডাক্ট সেভ বা এডিট করার ফাংশন
  function saveProduct(e) {
    e.preventDefault();
    let key = document.getElementById("editKey").value;
    let colorsInput = document.getElementById("pColors").value.split(',').map(s => s.trim()).filter(Boolean);
    
    let pData = {
      id: key ? products.find(p => p._key === key).id : Date.now(),
      name: document.getElementById("pName").value,
      cat: document.getElementById("pCat").value,
      price: Number(document.getElementById("pPrice").value),
      stock: Number(document.getElementById("pStock").value),
      img: document.getElementById("pImg").value,
      colors: colorsInput,
      desc: document.getElementById("pDesc").value,
      rating: "5.0", sales: 0
    };

    if(key) {
      db.ref('dhong_products/' + key).update(pData).then(() => { alert("✅ পণ্য আপডেট হয়েছে!"); resetForm(); });
    } else {
      db.ref('dhong_products').push(pData).then(() => { alert("✅ নতুন পণ্য যুক্ত হয়েছে!"); resetForm(); });
    }
  }

  function editProduct(key) {
    let p = products.find(item => item._key === key);
    if(!p) return;
    document.getElementById("editKey").value = key;
    document.getElementById("pName").value = p.name;
    document.getElementById("pCat").value = p.cat;
    document.getElementById("pPrice").value = p.price;
    document.getElementById("pStock").value = p.stock;
    document.getElementById("pImg").value = p.img || '';
    document.getElementById("pColors").value = Array.isArray(p.colors) ? p.colors.join(", ") : '';
    document.getElementById("pDesc").value = p.desc || '';
    document.getElementById("formTitle").textContent = "পণ্য এডিট করুন";
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function resetForm() {
    document.getElementById("productForm").reset();
    document.getElementById("editKey").value = "";
    document.getElementById("formTitle").textContent = "নতুন পণ্য যোগ বা এডিট";
  }

  function deleteProduct(key) { if(confirm("পণ্য ডিলিট করতে চান?")) db.ref('dhong_products/' + key).remove(); }

  // মডারেটর ম্যানেজমেন্ট
  function addModerator() {
    let u = document.getElementById("modUser").value.trim();
    let p = document.getElementById("modPass").value.trim();
    if(!u || !p) return alert("ইউজারনেম ও পাসওয়ার্ড দিন।");
    db.ref('dhong_moderators/' + u).set({ password: p }).then(() => { alert("✅ মডারেটর যোগ হয়েছে!"); document.getElementById("modUser").value=''; document.getElementById("modPass").value=''; });
  }

  function loadModerators() {
    db.ref('dhong_moderators').once('value').then(snap => {
      let html = "";
      snap.forEach(ch => {
        html += `<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #ddd"><b>${ch.key}</b> <button class="btn" style="background:#e53e3e;color:white;padding:2px 6px" onclick="db.ref('dhong_moderators/${ch.key}').remove()">ডিলিট</button></div>`;
      });
      document.getElementById("modList").innerHTML = html || "<small>কোনো মডারেটর নেই।</small>";
    });
  }
</script>
</body>
</html>
