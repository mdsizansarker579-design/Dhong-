<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ঢং শপ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f9f9f9; padding-bottom: 60px; color: #333; }
    
    header { background: #1b5e20; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 18px; font-weight: bold; cursor: pointer; }
    .admin-link { background: #fff; color: #1b5e20; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-decoration: none; }

    .banner { background: #e8f5e9; color: #1b5e20; padding: 15px; text-align: center; font-size: 14px; font-weight: bold; border-bottom: 1px solid #c8e6c9; }

    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; max-width: 900px; margin: 0 auto; }
    @media(min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

    .product-card { background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e0e0e0; display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; background: #eee; }
    .product-info { padding: 10px; }
    .product-title { font-size: 13px; font-weight: 600; color: #222; margin-bottom: 4px; cursor: pointer; }
    .product-price { font-size: 15px; font-weight: bold; color: #e53935; }
    .order-btn { background: #1b5e20; color: white; border: none; padding: 8px; border-radius: 5px; width: 100%; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 8px; }

    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 15px; font-size: 22px; cursor: pointer; font-weight: bold; color: #666; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="window.location.href='index.html'">ঢং শপ</div>
    <a href="admin.html" class="admin-link">এডমিন প্যানেল</a>
  </header>

  <div class="banner">🚚 ক্যাশ অন ডেলিভারি - সারা দেশে হোম ডেলিভারি!</div>

  <div class="product-grid" id="customerProductGrid"></div>

  <!-- Order Modal -->
  <div class="modal" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div style="display:flex; gap:10px; margin-bottom:12px; align-items:center;">
        <img id="mImg" src="" style="width:60px; height:60px; object-fit:cover; border-radius:5px;">
        <div>
          <h4 id="mTitle" style="font-size:14px;"></h4>
          <p id="mPrice" style="color:#e53935; font-weight:bold; font-size:15px;"></p>
        </div>
      </div>

      <hr style="margin-bottom:12px; border:0; border-top:1px solid #eee;">

      <div class="form-group" id="sizeBox" style="display:none;">
        <label>সাইজ নির্বাচন করুন *</label>
        <select id="selSize"></select>
      </div>

      <div class="form-group" id="colorBox" style="display:none;">
        <label>কালার নির্বাচন করুন *</label>
        <select id="selColor"></select>
      </div>

      <div class="form-group">
        <label>আপনার নাম *</label>
        <input type="text" id="cName" placeholder="পুরো নাম লিখুন">
      </div>

      <div class="form-group">
        <label>মোবাইল নম্বর *</label>
        <input type="tel" id="cPhone" placeholder="017XXXXXXXX">
      </div>

      <div class="form-group">
        <label>পূর্ণাঙ্গ ঠিকানা *</label>
        <textarea id="cAddress" rows="2" placeholder="বাসা নং, রোড, এলাকা, থানা, জেলা"></textarea>
      </div>

      <div class="form-group">
        <label>ডেলিভারি এরিয়া *</label>
        <select id="cDelivery" onchange="calculateTotal()">
          <option value="80">ঢাকার ভেতরে (৮০ টাকা)</option>
          <option value="150">ঢাকার বাইরে (১৫০ টাকা)</option>
        </select>
      </div>

      <div style="background:#f4f6f9; padding:10px; border-radius:5px; font-size:14px; font-weight:bold; margin-bottom:12px;">
        সর্বমোট মূল্য: ৳<span id="cTotal">0</span>
      </div>

      <button class="order-btn" style="padding:10px; font-size:15px;" onclick="submitOrder()">অর্ডার নিশ্চিত করুন</button>
    </div>
  </div>

  <script>
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let selectedProduct = null;

    function renderStore() {
      const grid = document.getElementById('customerProductGrid');
      grid.innerHTML = '';
      if(products.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:20px; color:#777;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>';
        return;
      }
      products.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.image || 'https://via.placeholder.com/150'}" class="product-img" onclick="openOrderModal(${p.id})">
            <div class="product-info">
              <div class="product-title" onclick="openOrderModal(${p.id})">${p.title}</div>
              <div class="product-price">৳${p.price}</div>
              <button class="order-btn" onclick="openOrderModal(${p.id})">অর্ডার করুন</button>
            </div>
          </div>
        `;
      });
    }

    function openOrderModal(id) {
      selectedProduct = products.find(p => p.id === id);
      if(!selectedProduct) return;

      window.history.pushState({}, '', `?product=${selectedProduct.id}`);

      document.getElementById('mImg').src = selectedProduct.image || 'https://via.placeholder.com/150';
      document.getElementById('mTitle').innerText = selectedProduct.title;
      document.getElementById('mPrice').innerText = '৳' + selectedProduct.price;

      const sBox = document.getElementById('sizeBox');
      const sSelect = document.getElementById('selSize');
      if(selectedProduct.sizes && selectedProduct.sizes.trim() !== "") {
        sBox.style.display = 'block';
        sSelect.innerHTML = selectedProduct.sizes.split(',').map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
      } else { sBox.style.display = 'none'; }

      const cBox = document.getElementById('colorBox');
      const cSelect = document.getElementById('selColor');
      if(selectedProduct.colors && selectedProduct.colors.trim() !== "") {
        cBox.style.display = 'block';
        cSelect.innerHTML = selectedProduct.colors.split(',').map(c => `<option value="${c.trim()}">${c.trim()}</option>`).join('');
      } else { cBox.style.display = 'none'; }

      calculateTotal();
      document.getElementById('orderModal').style.display = 'flex';
    }

    function calculateTotal() {
      if(!selectedProduct) return;
      const price = parseInt(selectedProduct.price) || 0;
      const delivery = parseInt(document.getElementById('cDelivery').value) || 0;
      document.getElementById('cTotal').innerText = price + delivery;
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
      window.history.pushState({}, '', window.location.pathname);
    }

    function submitOrder() {
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const address = document.getElementById('cAddress').value.trim();
      
      if(!name || !phone || !address) {
        alert('দয়া করে আপনার নাম, মোবাইল নম্বর এবং সম্পূর্ণ ঠিকানা লিখুন!');
        return;
      }

      const size = (selectedProduct.sizes && selectedProduct.sizes.trim() !== "") ? document.getElementById('selSize').value : '';
      const color = (selectedProduct.colors && selectedProduct.colors.trim() !== "") ? document.getElementById('selColor').value : '';
      const deliveryCharge = parseInt(document.getElementById('cDelivery').value);
      const total = parseInt(selectedProduct.price) + deliveryCharge;

      let orders = JSON.parse(localStorage.getItem('orders')) || [];
      orders.push({
        orderId: Date.now().toString().slice(-5),
        productTitle: selectedProduct.title,
        price: selectedProduct.price,
        size: size,
        color: color,
        name: name,
        phone: phone,
        address: address,
        deliveryCharge: deliveryCharge,
        total: total,
        date: new Date().toLocaleDateString()
      });

      localStorage.setItem('orders', JSON.stringify(orders));
      alert('অভিনন্দন! আপনার অর্ডারটি সফলভাবে জমা হয়েছে।');
      closeModal();
    }

    window.onload = function() {
      renderStore();
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('product');
      if(prodId) {
        openOrderModal(parseInt(prodId));
      }
    };
  </script>
</body>
</html>
