<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHONG | Customer Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f8fb;color:#182230}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{background:#17243a;color:white;text-align:center;padding:10px}
header{background:white;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:bold;color:#c83d58}
.search{flex:1;min-width:180px;padding:11px;border:1px solid #ddd;border-radius:10px}
button{border:0;border-radius:9px;padding:11px 15px}
.primary{background:#e85d75;color:white;font-weight:bold}
.hero{margin:16px auto;max-width:1100px;padding:30px 22px;border-radius:18px;background:linear-gradient(120deg,#242b49,#a23b5d,#ee9a8c);color:white}
.hero h1{font-size:34px}
.hero p{line-height:1.7}
main{max-width:1100px;margin:25px auto;padding:0 14px}
.categories{display:flex;gap:8px;overflow:auto;margin:15px 0}
.categories button{background:white;border:1px solid #ddd;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.product{background:white;border:1px solid #e5e7eb;border-radius:13px;overflow:hidden}
.art{height:160px;display:grid;place-items:center;background:#f0f2f5}
.art img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}
.info h3{font-size:14px;min-height:35px}
.price{font-size:17px;font-weight:bold}
.buy{width:100%;margin-top:12px;background:#e85d75;color:white;font-weight:bold}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}
.benefit{background:white;border:1px solid #eee;padding:15px;border-radius:12px}
footer{background:#17243a;color:white;padding:25px;line-height:1.8}
.modalbg{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:14px;z-index:10}
.modalbg.show{display:flex}
.modal{background:white;border-radius:15px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.field{display:block;margin:12px 0;font-size:13px;font-weight:bold}
.field input,.field select,.field textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #ddd;border-radius:8px}
.modal .primary{width:100%;margin-top:10px}
.close{float:right;background:#eee}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:135px}.hero h1{font-size:27px}.benefits{grid-template-columns:1fr}header{padding:10px}.search{order:3;flex-basis:100%}}
</style>
</head>
<body>

<div class="top">🎉 ঢং-এ স্বাগতম | ক্যাশ অন ডেলিভারি</div>

<header>
  <div class="logo">ঢং DHONG</div>
  <input class="search" id="search" placeholder="পণ্য খুঁজুন..." oninput="renderProducts()">
  <button onclick="openTrack()">📦 অর্ডার ট্র্যাক</button>
</header>

<section class="hero">
  <h1>আপনার স্টাইল, আপনারই গল্প।</h1>
  <p>পছন্দের পণ্য বেছে নিন এবং অ্যাকাউন্ট ছাড়াই সরাসরি অর্ডার করুন।</p>
  <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">পণ্য দেখুন ↓</button>
</section>

<main id="products">
  <h2>জনপ্রিয় পণ্য</h2>
  <div class="categories">
    <button onclick="setCategory('সব')">সব পণ্য</button>
    <button onclick="setCategory('পোশাক')">পোশাক</button>
    <button onclick="setCategory('ব্যাগ')">ব্যাগ</button>
    <button onclick="setCategory('অ্যাক্সেসরিজ')">অ্যাক্সেসরিজ</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <b>DHONG | ঢং</b><br>
  আপনার পছন্দের পণ্য সহজে অর্ডার করুন।<br>
  <button onclick="openTrack()">আমার অর্ডার ট্র্যাক করুন</button>
</footer>

<!-- অর্ডার মডাল -->
<div class="modalbg" id="orderModal">
  <div class="modal">
    <button class="close" onclick="closeModal('orderModal')">✕</button>
    <h2>অর্ডার করুন</h2>
    <form id="orderForm">
      <input type="hidden" name="productId" id="productId">

      <label class="field">আপনার নাম
        <input name="name" required placeholder="সম্পূর্ণ নাম">
      </label>

      <label class="field">মোবাইল নম্বর
        <input name="phone" required inputmode="tel" pattern="01[3-9][0-9]{8}" placeholder="01XXXXXXXXX">
      </label>

      <label class="field">কালার নির্বাচন করুন
        <select name="color" id="productColor" required>
          <option value="Standard">স্ট্যান্ডার্ড</option>
          <option value="Black">কালো (Black)</option>
          <option value="White">সাদা (White)</option>
          <option value="Red">লাল (Red)</option>
          <option value="Blue">নীল (Blue)</option>
        </select>
      </label>

      <label class="field">সাইজ / ভ্যারিয়েন্ট
        <select name="size" id="productSize" required>
          <option value="Free Size">Free Size</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </label>

      <label class="field">পরিমাণ
        <select name="quantity" id="quantity" onchange="updateTotal()">
          <option value="1">১টি</option>
          <option value="2">২টি</option>
          <option value="3">৩টি</option>
          <option value="4">৪টি</option>
          <option value="5">৫টি</option>
        </select>
      </label>

      <label class="field">ডেলিভারি এলাকা (চার্জ)</label>
      <select name="deliveryArea" id="deliveryArea" onchange="updateTotal()" required>
        <option value="60">ঢাকা ভেতরে (৳৬০)</option>
        <option value="120">ঢাকা বাইরে / সারা দেশ (৳১২০)</option>
      </select>

      <label class="field">সম্পূর্ণ ঠিকানা
        <textarea name="address" required rows="3" placeholder="বাসা, রোড, এলাকা, থানা, জেলা"></textarea>
      </label>

      <p><b id="summary">মোট: ৳০</b></p>
      <button class="primary" type="submit" id="submitBtn">অর্ডার নিশ্চিত করুন</button>
    </form>
  </div>
</div>

<!-- ট্র্যাকিং মডাল -->
<div class="modalbg" id="trackModal">
  <div class="modal">
    <button class="close" onclick="closeModal('trackModal')">✕</button>
    <h2>অর্ডার ট্র্যাক করুন</h2>
    <form id="trackForm">
      <label class="field">অর্ডার নম্বর
        <input name="orderId" required placeholder="যেমন: 1, 2, 3...">
      </label>
      <button class="primary" type="submit">স্ট্যাটাস দেখুন</button>
    </form>
    <p id="trackResult"></p>
  </div>
</div>

<script>
const API_URL = "https://dhong-api.mdsizansarker579.workers.dev";

const products=[
 {id:1,name:"এলিগ্যান্ট কটন কুর্তি",cat:"পোশাক",price:1250,img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=300"},
 {id:2,name:"প্রিমিয়াম ক্রসব্যাগ",cat:"ব্যাগ",price:950,img:"https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=300"},
 {id:3,name:"সফট কালার থ্রি-পিস",cat:"পোশাক",price:1850,img:"https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=300"},
 {id:4,name:"ক্লাসিক হ্যান্ডব্যাগ",cat:"ব্যাগ",price:1450,img:"https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=300"}
];

let category="সব", selectedProduct=null;

function money(n){ return "৳"+Number(n).toLocaleString("en-US"); }

function renderProducts(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(category==="সব"||p.cat===category)&&p.name.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.map(p=>`
  <article class="product">
   <div class="art"><img src="${p.img}" alt="${p.name}"></div>
   <div class="info">
    <small>${p.cat}</small>
    <h3>${p.name}</h3>
    <div class="price">${money(p.price)}</div>
    <button class="buy" onclick="openOrder(${p.id})">অর্ডার করুন</button>
   </div>
  </article>
 `).join("");
}

function setCategory(c){ category=c; renderProducts(); }

function openOrder(id){
 selectedProduct=products.find(p=>p.id===id);
 document.getElementById("productId").value=id;
 document.getElementById("quantity").value="1";
 document.getElementById("deliveryArea").value="60";
 updateTotal();
 document.getElementById("orderModal").classList.add("show");
}

function updateTotal(){
 if(selectedProduct){
  const qty=Number(document.getElementById("quantity").value);
  const deliveryFee=Number(document.getElementById("deliveryArea").value);
  const total = (selectedProduct.price * qty) + deliveryFee;
  document.getElementById("summary").textContent=`পণ্যের দাম: ${money(selectedProduct.price*qty)} + ডেলিভারি চার্জ: ${money(deliveryFee)} = মোট: ${money(total)}`;
 }
}

function openTrack(){ document.getElementById("trackModal").classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

document.getElementById("orderForm").addEventListener("submit", async function(e){
 e.preventDefault();
 const submitBtn = document.getElementById("submitBtn");
 submitBtn.disabled = true;
 submitBtn.textContent = "অর্ডার প্রসেস হচ্ছে...";

 const formData = new FormData(e.target);
 const qty = Number(formData.get("quantity"));
 const deliveryFee = Number(formData.get("deliveryArea"));
 const productTotal = selectedProduct.price * qty;
 const grandTotal = productTotal + deliveryFee;

 const payload = {
   name: formData.get("name"),
   phone: formData.get("phone"),
   address: formData.get("address"),
   items: [{ 
     id: selectedProduct.id, 
     name: selectedProduct.name, 
     price: selectedProduct.price, 
     quantity: qty,
     color: formData.get("color"),
     size: formData.get("size"),
     deliveryFee: deliveryFee
   }],
   total: grandTotal
 };

 try {
   const res = await fetch(`${API_URL}/api/orders`, {
     method: "POST",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify(payload)
   });

   const data = await res.json();

   if(res.ok && data.success) {
     alert(`✅ অর্ডার সফল হয়েছে!\nঅর্ডার নম্বর: #DH-${data.orderId}\nমোট (ডেলিভারি সহ): ${money(grandTotal)}`);
     e.target.reset();
     closeModal("orderModal");
   } else {
     alert("❌ সমস্যা: " + (data.error || "অর্ডার জমা হয়নি"));
   }
 } catch(err) {
   alert("❌ নেটওয়ার্ক এরর।");
 } finally {
   submitBtn.disabled = false;
   submitBtn.textContent = "অর্ডার নিশ্চিত করুন";
 }
});

document.getElementById("trackForm").addEventListener("submit", async function(e){
 e.preventDefault();
 const orderId = e.target.orderId.value.replace(/[^0-9]/g, '');
 const resultEl = document.getElementById("trackResult");
 resultEl.textContent = "খোঁজ করা হচ্ছে...";

 try {
   const res = await fetch(`${API_URL}/api/admin/orders`);
   const data = await res.json();
   
   if(data.success && data.orders) {
     const order = data.orders.find(o => String(o.id) === orderId);
     if(order) {
       resultEl.innerHTML = `<br><b>অর্ডার:</b> #DH-${order.id}<br><b>নাম:</b> ${order.customer_name}<br><b>স্ট্যাটাস:</b> <span style="color:green">${order.status}</span>`;
     } else {
       resultEl.textContent = "কোনো অর্ডার পাওয়া যায়নি।";
     }
   }
 } catch(err) {
   resultEl.textContent = "স্ট্যাটাস পাওয়া যায়নি।";
 }
});

renderProducts();
</script>
</body>
</html>
