<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="siteTitle">DHONG | Customer Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root { --primary-color: #e85d75; --top-bg: #17243a; --bg-color: #f7f8fb; --card-bg: #ffffff; --text-color: #182230; }
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg-color);color:var(--text-color)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 13px}
.top{background:var(--top-bg);color:white;text-align:center;padding:9px 12px;font-size:13px;font-weight:bold}
header{background:var(--card-bg);padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,0.05);position:sticky;top:0;z-index:9}
.logo{font-size:22px;font-weight:800;color:var(--primary-color)}
.search{flex:1;min-width:160px;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:24px;outline:none}
.primary{background:var(--primary-color);color:white;font-weight:bold}
.hero{margin:12px auto;max-width:1100px;border-radius:16px;color:white;padding:20px;background:#242b49}
main{max-width:1100px;margin:15px auto;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.product{background:var(--card-bg);border:1px solid #edf2f7;border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.art{height:180px;display:grid;place-items:center;background:#fafafa;position:relative}
.art img{width:100%;height:100%;object-fit:contain;padding:6px}
.info{padding:12px;display:flex;flex-direction:column;flex:1}
.info h3{font-size:14px;height:36px;margin:2px 0 6px 0;overflow:hidden}
.price{font-size:17px;font-weight:bold;color:var(--primary-color)}
.buy-group{display:flex;gap:6px;margin-top:10px}
.buy{flex:1;background:var(--primary-color);color:white;font-weight:bold;padding:9px;border-radius:8px;font-size:12px}
.cart-btn{background:#edf2f7;color:#2d3748;font-weight:bold;padding:9px 12px;border-radius:8px;font-size:12px}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);align-items:center;justify-content:center;padding:10px;z-index:999}
.modalbg.show{display:flex}
.modal{background:var(--card-bg);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;position:relative}
.field{display:block;margin:10px 0;font-size:13px;font-weight:600;color:#4a5568}
.field input,.field select,.field textarea{display:block;width:100%;padding:10px 12px;margin-top:4px;border:1.5px solid #e2e8f0;border-radius:8px}
.close{position:sticky;top:0;float:right;background:#edf2f7;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.slider-container{width:100%;height:260px;background:#fafafa;overflow:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}
.slider-track{display:flex;transition:transform 0.3s;height:100%;width:100%}
.slider-item{flex:0 0 100%;min-width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.slider-item img{max-width:100%;max-height:100%;object-fit:contain}
.color-thumbs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.color-thumb{width:50px;height:50px;border-radius:6px;border:2px solid #e2e8f0;cursor:pointer;object-fit:cover}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="top" id="topBanner">🎉 ঢং-এ স্বাগতম | ক্যাশ অন ডেলিভারি</div>
<header>
  <div class="logo" id="logoText">DHONG</div>
  <input class="search" id="search" placeholder="পণ্য খুঁজুন..." oninput="renderProducts()">
  <button onclick="openCartModal()" style="background:#2b6cb0;color:white;font-weight:bold">🛒 কার্ট (<span id="cartCount">০</span>)</button>
  <button onclick="openTrack()" class="primary">📦 ট্র্যাক</button>
</header>

<main id="products">
  <div class="grid" id="grid"></div>
</main>

<!-- Product Detail Modal -->
<div class="modalbg" id="detailModal"><div class="modal"><span class="close" onclick="closeModal('detailModal')">✕</span><div id="detailContent"></div></div></div>

<!-- Order Modal -->
<div class="modalbg" id="orderModal">
  <div class="modal">
    <span class="close" onclick="closeModal('orderModal')">✕</span>
    <h2>অর্ডার ফর্ম</h2>
    <form id="orderForm" onsubmit="submitSingleOrder(event)">
      <input type="hidden" name="productId" id="productId">
      <div style="text-align:center;margin-bottom:12px;">
        <img id="orderPreviewImg" src="" style="width:65px;height:65px;object-fit:contain;border-radius:8px;border:1px solid #ddd;display:none;">
      </div>
      <label class="field">আপনার নাম <input name="name" required placeholder="নাম"></label>
      <label class="field">মোবাইল নম্বর <input name="phone" required placeholder="01XXXXXXXXX"></label>
      <label class="field">পরিমাণ <select name="quantity" id="quantity" onchange="updateTotal()"><option value="1">১টি</option><option value="2">২টি</option><option value="3">৩টি</option></select></label>
      <label class="field">সম্পূর্ণ ঠিকানা <textarea name="address" required rows="2" placeholder="পূর্ণ ঠিকানা"></textarea></label>
      <p style="background:#f7fafc;padding:10px;border-radius:8px"><b id="summary">মোট: ৳০</b></p>
      <button class="primary" type="submit" style="width:100%">অর্ডার কনফার্ম করুন</button>
    </form>
  </div>
</div>

<!-- Cart Modal -->
<div class="modalbg" id="cartModal"><div class="modal"><span class="close" onclick="closeModal('cartModal')">✕</span><h2>কার্ট</h2><div id="cartItemsList"></div></div></div>
<div class="modalbg" id="trackModal"><div class="modal"><span class="close" onclick="closeModal('trackModal')">✕</span><h2>ট্র্যাক</h2><form id="trackForm" onsubmit="trackOrder(event)"><input name="orderId" required placeholder="অর্ডার আইডি"><button class="primary" type="submit">খুঁজুন</button></form><div id="trackResult"></div></div></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNQLZU6KiVHp6IcAh4G70Trf7ThTcuLqw",
    authDomain: "dhong-c897d.firebaseapp.com",
    projectId: "dhong-c897d",
    storageBucket: "dhong-c897d.firebasestorage.app",
    messagingSenderId: "14236976798",
    appId: "1:14236976798:web:d8ae40a5add4a70b2a1d8f",
    measurementId: "G-J2RC81D0WB"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let products = [], cart = JSON.parse(localStorage.getItem("dhong_cart") || "[]");
  let selectedProduct = null;

  db.ref('dhong_products').on('value', snap => {
    products = [];
    snap.forEach(ch => { let v = ch.val(); if(v) { v._key = ch.key; products.push(v); } });
    renderProducts();
  });

  updateCartCount();

  function renderProducts(){
    let q = document.getElementById("search").value.toLowerCase();
    let list = products.filter(p => String(p.name||"").toLowerCase().includes(q));
    document.getElementById("grid").innerHTML = list.map(p => `
      <article class="product" onclick="showProductDetail('${p.id}')">
        <div class="art"><img src="${p.img || ''}" loading="lazy"></div>
        <div class="info">
          <h3>${p.name}</h3>
          <div class="price">৳${p.price}</div>
          <div class="buy-group">
            <button class="buy" onclick="event.stopPropagation(); openOrder('${p.id}')">অর্ডার</button>
            <button class="cart-btn" onclick="event.stopPropagation(); addToCart('${p.id}')">🛒</button>
          </div>
        </div>
      </article>`).join("");
  }

  function addToCart(id) {
    let p = products.find(prod => String(prod.id) === String(id));
    if(!p || p.stock <= 0) return alert("স্টক শেষ!");
    let ex = cart.find(i => i.id === id);
    if(ex) ex.quantity++; else cart.push({id: p.id, name: p.name, price: p.price, img: p.img, quantity: 1});
    localStorage.setItem("dhong_cart", JSON.stringify(cart));
    updateCartCount(); alert("কার্টে যোগ হয়েছে!");
  }

  function updateCartCount() { document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.quantity, 0); }
  function openCartModal() {
    document.getElementById("cartItemsList").innerHTML = cart.length ? cart.map(i=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><img src="${i.img}" style="width:40px;height:40px">${i.name} (×${i.quantity}) - ৳${i.price*i.quantity}</div>`).join("") : "খালি";
    document.getElementById("cartModal").classList.add("show");
  }

  function showProductDetail(id){
    let p = products.find(prod => String(prod.id) === String(id));
    if(!p) return;
    let imgs = [p.img, ...(Array.isArray(p.colors) ? p.colors : Object.values(p.colors || {}))].filter(Boolean);
    let slider = imgs.length ? `<div class="slider-container"><div class="slider-track" id="st" style="width:${imgs.length*100}%">${imgs.map(img=>`<div class="slider-item"><img src="${img}"></div>`).join("")}</div></div><div class="color-thumbs">${imgs.map((img,i)=>`<img src="${img}" class="color-thumb" onclick="document.getElementById('st').style.transform='translateX(-${i*100}%)'">`).join("")}</div>` : '';
    document.getElementById("detailContent").innerHTML = `${slider}<h2>${p.name}</h2><h3>৳${p.price}</h3><p>${p.desc||''}</p><button class="primary" style="width:100%" onclick="closeModal('detailModal'); openOrder('${p.id}')">অর্ডার করুন</button>`;
    document.getElementById("detailModal").classList.add("show");
  }

  function openOrder(id){
    selectedProduct = products.find(p => String(p.id) === String(id));
    if(!selectedProduct) return;
    document.getElementById("productId").value = selectedProduct.id;
    document.getElementById("orderPreviewImg").src = selectedProduct.img || '';
    document.getElementById("orderPreviewImg").style.display = selectedProduct.img ? 'inline-block' : 'none';
    updateTotal();
    document.getElementById("orderModal").classList.add("show");
  }

  function updateTotal() {
    if(!selectedProduct) return;
    let qty = Number(document.getElementById("quantity").value || 1);
    document.getElementById("summary").textContent = `মোট: ৳${selectedProduct.price * qty + 60}`;
  }

  function submitSingleOrder(e) {
    e.preventDefault();
    let f = e.target;
    let qty = Number(f.quantity.value);
    let items = [{ id: selectedProduct.id, name: selectedProduct.name, price: selectedProduct.price, quantity: qty, img: selectedProduct.img }];
    let orderData = {
      id: Date.now().toString().slice(-6), customer_name: f.name.value, phone: f.phone.value, address: f.address.value,
      items_json: JSON.stringify(items), total: selectedProduct.price * qty + 60, status: "Pending", created_at: new Date().toISOString()
    };
    db.ref('dhong_orders').push(orderData).then(() => {
      // স্টক কমানো
      let newStock = Math.max(0, Number(selectedProduct.stock || 0) - qty);
      db.ref('dhong_products/' + selectedProduct._key).update({ stock: newStock, sales: (Number(selectedProduct.sales||0) + qty) });
      alert("✅ অর্ডার সফলভাবে কনফার্ম হয়েছে!"); closeModal('orderModal');
    });
  }

  function openTrack(){ document.getElementById("trackModal").classList.add("show"); }
  function trackOrder(e){
    e.preventDefault();
    let id = e.target.orderId.value.trim();
    db.ref('dhong_orders').orderByChild('id').equalTo(id).once('value').then(snap => {
      let res = document.getElementById("trackResult");
      if(!snap.exists()){ res.innerHTML = "পাওয়া যায়নি"; return; }
      snap.forEach(ch => { let o = ch.val(); res.innerHTML = `স্ট্যাটাস: <b>${o.status}</b>`; });
    });
  }
  function closeModal(id){ document.getElementById(id).classList.remove("show"); }
</script>
</body>
</html>
