<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ঢং শপ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding-bottom: 80px; }
    
    header { background: #1b5e20; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .shop-name { font-size: 20px; font-weight: bold; cursor: pointer; }
    .cart-btn { background: #4caf50; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
    .cart-count { background: #e53935; color: white; border-radius: 50%; padding: 2px 7px; font-size: 12px; }

    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding: 12px 20px; background: white; border-bottom: 1px solid #ddd; }
    .cat-btn { padding: 6px 16px; border: 1px solid #1b5e20; background: transparent; color: #1b5e20; border-radius: 15px; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .cat-btn.active, .cat-btn:hover { background: #1b5e20; color: white; }

    .search-box { padding: 15px 20px; max-width: 600px; margin: 0 auto; }
    .search-box input { width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px 20px; max-width: 1100px; margin: 0 auto; }
    .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .product-card:hover { transform: translateY(-3px); }
    .product-img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; }
    .product-info { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
    .product-title { font-size: 14px; font-weight: 600; color: #333; cursor: pointer; }
    .product-price { font-size: 15px; font-weight: bold; color: #e53935; }
    .stock-badge { font-size: 11px; color: #666; }
    .add-to-cart-btn { background: #1b5e20; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; right: 15px; top: 15px; font-size: 20px; cursor: pointer; font-weight: bold; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; }
    .cod-badge { background: #e8f5e9; border: 1px solid #4caf50; padding: 10px; border-radius: 5px; color: #2e7d32; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="shop-name" onclick="window.location.href='index.html'">ঢং শপ</div>
    <button class="cart-btn" onclick="openCart()">
      🛒 কার্ট <span class="cart-count" id="cartCount">0</span>
    </button>
  </header>

  <div class="categories-bar" id="categoryList">
    <button class="cat-btn active" onclick="filterCategory('All')">সবকটি</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="প্রোডাক্ট খুঁজুন..." onkeyup="searchProduct()">
  </div>

  <div class="product-grid" id="productGrid"></div>

  <!-- Product Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
      <img id="modalImg" src="" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
      <h3 id="modalTitle"></h3>
      <p id="modalPrice" style="color:#e53935; font-weight:bold; font-size:18px; margin: 5px 0;"></p>
      
      <div class="form-group" id="sizeGroup" style="display:none;">
        <label>সাইজ (Size) নির্বাচন করুন:</label>
        <select id="modalSize"></select>
      </div>

      <div class="form-group" id="colorGroup" style="display:none;">
        <label>কালার (Color) নির্বাচন করুন:</label>
        <select id="modalColor"></select>
      </div>

      <p id="modalDesc" style="font-size:14px; color:#555; margin:10px 0; line-height:1.4;"></p>
      <button class="add-to-cart-btn" id="modalAddBtn" style="padding:10px;">কার্টে যোগ করুন</button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cartModal')">&times;</span>
      <h3>আপনার শপিং কার্ট</h3>
      <div id="cartItems" style="margin: 15px 0;"></div>
      <hr style="margin: 10px 0;">

      <h4>অর্ডার তথ্য দিন</h4>
      <div class="form-group">
        <label>আপনার নাম *</label>
        <input type="text" id="custName" required placeholder="আপনার নাম লিখুন">
      </div>
      <div class="form-group">
        <label>মোবাইল নম্বর *</label>
        <input type="tel" id="custPhone" required placeholder="017xxxxxxxx">
      </div>
      <div class="form-group">
        <label>পূর্ণাঙ্গ ঠিকানা *</label>
        <textarea id="custAddress" rows="2" placeholder="বাড়ি নং, রোড নং, এলাকা, থানা, জেলা..."></textarea>
      </div>
      
      <div class="form-group">
        <label>ডেলিভারি এরিয়া *</label>
        <select id="deliveryZone" onchange="updateTotal()">
          <option value="80">ঢাকার ভেতরে (৮০ টাকা)</option>
          <option value="150">ঢাকার বাইরে (১৫০ টাকা)</option>
        </select>
      </div>

      <div class="form-group">
        <label>পেমেন্ট মেথড *</label>
        <select id="payMethod" onchange="togglePaymentInfo()">
          <option value="COD">ক্যাশ অন ডেলিভারি (Cash on Delivery)</option>
          <option value="bKash">বিকাশ (bKash)</option>
          <option value="Nagad">নগদ (Nagad)</option>
          <option value="Rocket">রকেট (Rocket)</option>
        </select>
      </div>

      <div id="codNotice" class="cod-badge">
        🚚 <b>ক্যাশ অন ডেলিভারি:</b> পণ্য হাতে পেয়ে ডেলিভারি ম্যানের কাছে সম্পূর্ণ টাকা পরিশোধ করুন।
      </div>

      <div id="paymentDetails" style="display:none; background:#e8f5e9; padding:10px; border-radius:5px; margin-bottom:12px;">
        <p style="font-size:12px; color:#2e7d32;">টাকা পাঠিয়ে নিচের তথ্য দিন:</p>
        <input type="text" id="payPhone" placeholder="যে নম্বর থেকে টাকা পাঠিয়েছেন" style="margin-top:5px;">
        <input type="text" id="payTxn" placeholder="Transaction ID (TxnID)" style="margin-top:5px;">
      </div>

      <div style="font-size: 16px; font-weight: bold; margin: 15px 0;">
        সর্বমোট মূল্য: ৳<span id="grandTotal">0</span>
      </div>

      <button class="add-to-cart-btn" style="padding:12px; font-size:16px; background:#1b5e20;" onclick="placeOrder()">অর্ডার নিশ্চিত করুন</button>
    </div>
  </div>

  <script>
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let cart = [];

    function renderProducts(items = products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      if(items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">কোনো প্রোডাক্ট পাওয়া যায়নি!</p>';
        return;
      }
      items.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${p.image}" class="product-img" onclick="showDetails(${p.id})">
            <div class="product-info">
              <div class="product-title" onclick="showDetails(${p.id})">${p.title}</div>
              <div class="product-price">৳${p.price}</div>
              <div class="stock-badge">স্টক: ${p.stock || 'পর্যাপ্ত'}</div>
              <button class="add-to-cart-btn" onclick="showDetails(${p.id})">বিস্তারিত / অর্ডার করুন</button>
            </div>
          </div>
        `;
      });
    }

    function renderCategories() {
      const catList = document.getElementById('categoryList');
      const cats = ['All', ...new Set(products.map(p => p.category))];
      catList.innerHTML = cats.map(c => 
        `<button class="cat-btn ${c==='All'?'active':''}" onclick="filterCategory('${c}')">${c==='All'?'সবকটি':c}</button>`
      ).join('');
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if(cat === 'All') renderProducts(products);
      else renderProducts(products.filter(p => p.category === cat));
    }

    function searchProduct() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(products.filter(p => p.title.toLowerCase().includes(q)));
    }

    function showDetails(id) {
      const p = products.find(prod => prod.id === id);
      if(!p) return;

      // Update URL so direct link works
      window.history.pushState({}, '', `?product=${p.id}`);

      document.getElementById('modalImg').src = p.image;
      document.getElementById('modalTitle').innerText = p.title;
      document.getElementById('modalPrice').innerText = '৳' + p.price;
      document.getElementById('modalDesc').innerText = p.desc || 'কোনো বিবরণ দেওয়া নেই।';

      const sGroup = document.getElementById('sizeGroup');
      const sSelect = document.getElementById('modalSize');
      if(p.sizes && p.sizes.trim() !== "") {
        sGroup.style.display = 'block';
        sSelect.innerHTML = p.sizes.split(',').map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('');
      } else { sGroup.style.display = 'none'; }

      const cGroup = document.getElementById('colorGroup');
      const cSelect = document.getElementById('modalColor');
      if(p.colors && p.colors.trim() !== "") {
        cGroup.style.display = 'block';
        cSelect.innerHTML = p.colors.split(',').map(c => `<option value="${c.trim()}">${c.trim()}</option>`).join('');
      } else { cGroup.style.display = 'none'; }

      document.getElementById('modalAddBtn').onclick = function() {
        const selSize = sGroup.style.display !== 'none' ? sSelect.value : '';
        const selColor = cGroup.style.display !== 'none' ? cSelect.value : '';
        addToCart(p, selSize, selColor);
        closeModal('detailModal');
        openCart();
      };

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal(id) { 
      document.getElementById(id).style.display = 'none'; 
      window.history.pushState({}, '', window.location.pathname);
    }

    function addToCart(p, size, color) {
      const item = cart.find(c => c.id === p.id && c.size === size && c.color === color);
      if(item) item.qty++;
      else cart.push({ id: p.id, title: p.title, price: p.price, size: size, color: color, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty, 0);
    }

    function openCart() {
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = cart.length === 0 ? '<p>কার্ট খালি!</p>' : '';
      cart.forEach((item, i) => {
        let variantText = [];
        if(item.size) variantText.push(`সাইজ: ${item.size}`);
        if(item.color) variantText.push(`কালার: ${item.color}`);
        let details = variantText.length > 0 ? `(${variantText.join(', ')})` : '';

        cartItems.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.title}</strong> ${details}<br>
              <small>৳${item.price} x ${item.qty}</small>
            </div>
            <div>
              <button onclick="changeQty(${i}, -1)">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${i}, 1)">+</button>
            </div>
          </div>
        `;
      });
      updateTotal();
      document.getElementById('cartModal').style.display = 'flex';
    }

    function changeQty(index, amt) {
      cart[index].qty += amt;
      if(cart[index].qty <= 0) cart.splice(index, 1);
      updateCartUI();
      openCart();
    }

    function updateTotal() {
      const subtotal = cart.reduce((a,b) => a + (b.price * b.qty), 0);
      const delivery = parseInt(document.getElementById('deliveryZone').value) || 0;
      document.getElementById('grandTotal').innerText = subtotal > 0 ? (subtotal + delivery) : 0;
    }

    function togglePaymentInfo() {
      const method = document.getElementById('payMethod').value;
      if(method === 'COD') {
        document.getElementById('codNotice').style.display = 'block';
        document.getElementById('paymentDetails').style.display = 'none';
      } else {
        document.getElementById('codNotice').style.display = 'none';
        document.getElementById('paymentDetails').style.display = 'block';
      }
    }

    function placeOrder() {
      alert('অর্ডার সফলভাবে সম্পন্ন হয়েছে! (ডেমো)');
    }

    // Auto-open product if link has ?product=ID
    window.onload = function() {
      renderProducts();
      renderCategories();
      
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('product');
      if(productId) {
        showDetails(parseInt(productId));
      }
    };
  </script>
</body>
</html>
